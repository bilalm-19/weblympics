<!-- MOCK ONLY (2026-11-08): a home-screen redesign proposal for the user to
     review. Not wired to the app, not committed. Plain SVG + CSS, no 3D, no
     images, no libraries, so it stays light on weak devices. -->
<style>
@font-face { font-family: "Fredoka"; font-weight: 400 700; font-display: swap; src: url("./assets/fonts/fredoka-latin-var.woff2") format("woff2"); }
:root {
  --blue: #0081c8; --yellow: #fcb131; --black: #1d1d1f; --green: #00a651; --red: #ee334e;
  --ink: #12304a; --ink-soft: #3f5b73; --panel: rgba(255,255,255,0.82); --panel-edge: rgba(255,255,255,0.95);
  --accent: var(--blue); --accent-soft: #d9efff;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font: 16px/1.4 "Fredoka", system-ui, sans-serif; color: var(--ink); background: #bfe4ff; overflow-x: hidden; }
button { font: inherit; cursor: pointer; }

/* ---- full-screen scene: one SVG, swapped per sport by CSS variables ---- */
.scene { position: fixed; inset: 0; z-index: 0; }
.scene svg { width: 100%; height: 100%; display: block; }
.sky { fill: url(#sky); }
.cloud { fill: #fff; opacity: .9; animation: drift 60s linear infinite; }
.cloud.c2 { animation-duration: 85s; animation-delay: -30s; opacity: .7; }
@keyframes drift { from { transform: translateX(-20%); } to { transform: translateX(120%); } }
.hills-far { fill: var(--hill-far, #7cc6a0); transition: fill .6s; }
.hills-near { fill: var(--hill-near, #4fae7b); transition: fill .6s; }
.stand { fill: var(--stand, #e9eef5); }
.stand-shade { fill: var(--stand-shade, #cdd7e3); }
.fans circle { animation: bob 1.6s ease-in-out infinite; }
.fans circle:nth-child(3n) { animation-delay: -.5s; } .fans circle:nth-child(3n+1) { animation-delay: -1s; }
@keyframes bob { 50% { transform: translateY(-3px); } }
.ground { fill: var(--ground, #3f9a57); transition: fill .6s; }
.field { transition: opacity .5s; }

/* ---- layout over the scene ---- */
.top { position: fixed; top: 0; left: 0; right: 0; z-index: 3; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: clamp(8px, 1.8vh, 18px) 28px; }
.top > :first-child { justify-self: start; } .top-right { justify-self: end; }
@media (max-height: 760px) and (min-width: 761px) { .word { font-size: 46px; -webkit-text-stroke: 7px var(--ink); } .rings { --rw: 19px; } .rings span { border-width: 3.5px; } }
.logo { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.rings { display: flex; gap: 0; --rw: clamp(20px, 2.9vh, 30px); } .rings span + span { margin-left: calc(var(--rw) * -0.44); } .rings span:nth-child(2), .rings span:nth-child(4) { z-index: 1; } .rings span { position: relative; } .rings span { width: var(--rw); height: var(--rw); border-radius: 50%; border: 4px solid; animation: pop .6s backwards; }
.rings span:nth-child(1){border-color:var(--blue)} .rings span:nth-child(2){border-color:var(--yellow);transform:translateY(calc(var(--rw) * .5));animation-delay:.08s}
.rings span:nth-child(3){border-color:var(--black);animation-delay:.16s} .rings span:nth-child(4){border-color:var(--green);transform:translateY(calc(var(--rw) * .5));animation-delay:.24s}
.rings span:nth-child(5){border-color:var(--red);animation-delay:.32s}
@keyframes pop { from { transform: scale(0); } }
.word { font-weight: 700; font-size: clamp(44px, 6.4vh, 70px); letter-spacing: -1px; color: #fff; -webkit-text-stroke: 7px var(--ink); paint-order: stroke fill; line-height: 1; }
.word b:nth-child(5n+1){color:var(--blue)} .word b:nth-child(5n+2){color:var(--yellow)} .word b:nth-child(5n+3){color:#fff} .word b:nth-child(5n+4){color:var(--green)} .word b:nth-child(5n){color:var(--red)}
.word b { font-weight: inherit; display: inline-block; }
.top-right { display: flex; gap: 10px; align-items: center; }
.icon-btn { width: 46px; height: 46px; border-radius: 50%; border: 0; background: var(--panel); box-shadow: 0 4px 14px rgba(18,48,74,.18); display: grid; place-items: center; font-size: 20px; }
.profile { display: flex; align-items: center; gap: 10px; padding: 5px 16px 5px 5px; border-radius: 30px; border: 0; background: var(--panel); box-shadow: 0 4px 14px rgba(18,48,74,.18); font-weight: 600; color: var(--ink); }
.profile .face { width: 40px; height: 40px; border-radius: 50%; background: #dff1ff; display: grid; place-items: center; overflow: hidden; }
.profile .tag { color: var(--ink-soft); font-weight: 500; font-size: 13px; }

main { position: relative; z-index: 2; min-height: 100%; display: grid; grid-template-columns: minmax(280px, .82fr) minmax(460px, 1.36fr) minmax(280px, .82fr); gap: clamp(16px, 2vw, 28px); padding: clamp(84px, 13vh, 120px) clamp(20px, 2.5vw, 40px) clamp(40px, 6vh, 56px); align-items: stretch; --colh: min(760px, calc(100vh - clamp(84px, 13vh, 120px) - clamp(40px, 6vh, 56px))); }
@media (min-width: 761px) { main > .sports, main > .stage, main > .me { height: var(--colh); max-height: none; min-height: 0; align-self: center; box-sizing: border-box; } }

/* sport cards */
.sports { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: repeat(3, 1fr); gap: clamp(10px, 1.6vh, 16px); align-content: center; max-height: min(680px, calc(100vh - 150px)); align-self: center; width: 100%; }
.card { position: relative; border: 0; border-radius: 22px; padding: 16px; text-align: left; color: #fff; background: var(--c); box-shadow: 0 6px 0 var(--c-dark), 0 12px 24px rgba(18,48,74,.25); display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto 1fr auto; column-gap: 8px; min-height: clamp(96px, 15vh, 140px); transition: transform .15s, box-shadow .15s; overflow: hidden; }
.card:hover { transform: translateY(-3px); }
.card[aria-pressed="true"] { outline: 5px solid #fff; outline-offset: 0; transform: translateY(-4px) scale(1.03); box-shadow: 0 8px 0 var(--c-dark), 0 18px 34px rgba(18,48,74,.35); }
.card .name { grid-column: 1; grid-row: 1; font-weight: 700; font-size: clamp(17px, 1.5vw, 26px); text-shadow: 0 2px 0 rgba(0,0,0,.15); white-space: nowrap; }
.card .blurb { grid-column: 1; grid-row: 3; font-size: 13px; opacity: .92; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 1500px) and (min-width: 761px) { .card .blurb { display: none; } }
.card svg.ic, .card canvas.ic3d { grid-column: 2; grid-row: 1 / span 3; align-self: center; width: clamp(56px, 5.2vw, 104px); height: auto; aspect-ratio: 1; }
.card[aria-pressed="true"] svg.ic { animation: wiggle 1.2s ease-in-out infinite; }
@keyframes wiggle { 50% { transform: rotate(-8deg) scale(1.06); } }
.card.tennis { --c: #2fa84f; --c-dark: #1f7a38; } .card.archery { --c: #e0453a; --c-dark: #a8302a; }
.card.track { --c: #f08a24; --c-dark: #b8651a; } .card.boxing { --c: #8a4fd8; --c-dark: #6533a6; }
.card.basketball { --c: #e86a24; --c-dark: #a8491a; } .card.bowling { --c: #2f7fe0; --c-dark: #1f5aa8; }

/* centre: sport header, small thumbnail, big buttons */
.stage { align-self: center; background: var(--panel); border: 2px solid var(--panel-edge); border-radius: 28px; padding: clamp(12px, 2vh, 20px); box-shadow: 0 16px 40px rgba(18,48,74,.22); backdrop-filter: blur(6px); display: flex; flex-direction: column; gap: clamp(8px, 1.4vh, 14px); }
.head { display: flex; flex-direction: column; gap: clamp(8px, 1.2vh, 12px); flex: 1 1 auto; min-height: 0; }
.preview { width: 100%; flex: 1 1 auto; min-height: 150px; height: auto; border-radius: 18px; overflow: hidden; background: #dff1ff; box-shadow: inset 0 0 0 3px #fff; }
.preview svg { width: 100%; height: 100%; display: block; }
.pitch { display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 12px; row-gap: 2px; }
.pitch h2 { margin: 0; font-size: clamp(24px, 3.2vh, 34px); line-height: 1.05; } .pitch p { margin: 0; color: var(--ink-soft); font-size: 15px; flex: 1 1 14em; }
.pitch .chip { display: inline-block; margin-top: 0; padding: 3px 10px; border-radius: 10px; background: var(--accent-soft); color: var(--ink); font-size: 12px; font-weight: 600; }
.actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
@media (min-width: 761px) { .actions .btn:not(.primary) { flex-direction: column; justify-content: center; text-align: center; gap: 4px; padding: 8px 6px; font-size: 16px; } .actions .btn:not(.primary) small { display: none; } .actions .btn:not(.primary) .ico { width: 34px; height: 34px; font-size: 20px; } }
.btn { border: 0; border-radius: 20px; padding: clamp(8px, 1.4vh, 14px) 16px; font-weight: 700; font-size: 18px; color: var(--ink); background: #fff; box-shadow: 0 5px 0 #c9d6e2; transition: transform .1s; display: flex; align-items: center; gap: 12px; text-align: left; }
.btn:hover { transform: translateY(-2px); }
.btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #c9d6e2; }
.btn .ico { flex: 0 0 auto; width: clamp(34px, 5vh, 46px); height: clamp(34px, 5vh, 46px); border-radius: 14px; display: grid; place-items: center; font-size: 24px; background: rgba(255,255,255,.7); }
.btn small { display: block; font-weight: 500; font-size: 13px; color: var(--ink-soft); }
.btn.primary { grid-column: 1 / -1; font-size: clamp(20px, 3vh, 26px); padding: clamp(10px, 1.8vh, 18px) 20px; background: linear-gradient(#ffd56b, var(--yellow)); box-shadow: 0 6px 0 #c98a14; }
.btn.primary .ico { width: clamp(40px, 6vh, 56px); height: clamp(40px, 6vh, 56px); font-size: clamp(22px, 3.4vh, 30px); }
.btn.primary small { color: #6b4a08; font-size: 14px; }
.btn.bot { background: #ffe1e6; box-shadow: 0 5px 0 #e9a3b0; }
.btn.train { background: #d9f5e3; box-shadow: 0 5px 0 #8fd1a8; }
.btn.guide { background: #e6eefc; box-shadow: 0 5px 0 #a9bde6; }
.btn.party { background: #f1e6ff; box-shadow: 0 5px 0 #c3a6ea; }
.join { display: flex; gap: 10px; } .join input { flex: 1; border: 2px solid #c9d6e2; border-radius: 16px; padding: 12px 16px; font: inherit; letter-spacing: 4px; text-transform: uppercase; }
.join .btn { padding: 10px 22px; font-size: 16px; }
.join input { padding: clamp(8px, 1.3vh, 12px) 16px; }

/* right: your party (you alone, or friends who joined) */
.me { align-self: center; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: clamp(12px, 2vh, 20px); max-height: min(680px, calc(100vh - 150px)); background: linear-gradient(180deg, rgba(255,255,255,.9) 0%, rgba(232,244,255,.85) 78%, #bfe6c8 78%, #9fd8ad 100%); border: 2px solid var(--panel-edge); border-radius: 28px; box-shadow: 0 16px 40px rgba(18,48,74,.22); backdrop-filter: blur(4px); width: 100%; box-sizing: border-box; justify-content: space-between; min-height: min(560px, calc(100vh - 170px)); overflow: hidden; }
.member svg { max-height: calc((var(--colh, 600px) - 190px) / var(--rows, 1)); }
.party-title { font-weight: 700; color: var(--ink); background: var(--panel); padding: 4px 14px; border-radius: 14px; font-size: 15px; }
.crew { display: flex; align-items: flex-end; justify-content: center; gap: 6px; width: 100%; flex-wrap: nowrap; }
.member { display: flex; flex-direction: column; align-items: center; gap: 6px; flex: 0 1 var(--w); animation: arrive .5s backwards; }
@keyframes arrive { from { transform: translateY(30px) scale(.6); opacity: 0; } }
.member svg { width: 100%; height: auto; filter: drop-shadow(0 10px 8px rgba(18,48,74,.25)); overflow: visible; }
.bubble { background: #fff; border-radius: 16px; padding: 8px 14px; font-weight: 600; box-shadow: 0 4px 12px rgba(18,48,74,.15); position: relative; }
.bubble::after { content: ""; position: absolute; bottom: -8px; left: 50%; margin-left: -8px; border: 8px solid transparent; border-top-color: #fff; border-bottom: 0; }
.member .bubble { font-size: 15px; white-space: nowrap; }
.nameplate { background: #fff; border-radius: 12px; padding: 4px 10px; font-weight: 700; font-size: 14px; box-shadow: 0 3px 8px rgba(18,48,74,.15); white-space: nowrap; display: flex; align-items: center; gap: 6px; }
.nameplate .dot { width: 8px; height: 8px; border-radius: 50%; background: #2fa84f; }
.nameplate .dot.away { background: #f2c230; }
.nameplate .lead { font-size: 12px; }
.crew.big { display: grid; grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); row-gap: 8px; column-gap: 4px; }
.crew.big .member, .crew.big .slot { flex: none; width: 100%; min-width: 0; }
.crew.big .nameplate { font-size: 11px; padding: 2px 6px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.crew.big .slot { aspect-ratio: auto; height: 100%; font-size: 12px; }
.slot { flex: 0 1 var(--w); aspect-ratio: 1/1.7; border: 3px dashed rgba(18,48,74,.35); border-radius: 30px; display: grid; place-items: center; color: var(--ink-soft); font-weight: 700; background: rgba(255,255,255,.35); font-size: 14px; text-align: center; padding: 8px; }
.me .edit { font-size: 14px; color: var(--blue); background: var(--panel); border: 0; border-radius: 12px; padding: 4px 12px; }
/* idle moves, each member a different one */
.m-wave .arm { transform-origin: 134px 140px; animation: wave 2.4s ease-in-out infinite; }
@keyframes wave { 0%,60%,100% { transform: rotate(0); } 70% { transform: rotate(-28deg); } 80% { transform: rotate(-8deg); } 90% { transform: rotate(-28deg); } }
.m-hop svg { animation: hop 1.8s ease-in-out infinite; }
@keyframes hop { 0%,70%,100% { transform: translateY(0); } 80% { transform: translateY(-14px); } }
.m-sway svg { transform-origin: 50% 100%; animation: sway 2.6s ease-in-out infinite; }
@keyframes sway { 50% { transform: rotate(4deg); } }
.m-cheer .arm, .m-cheer .arm2 { animation: cheer 1.4s ease-in-out infinite; }
.m-cheer .arm { transform-origin: 134px 140px; } .m-cheer .arm2 { transform-origin: 66px 140px; animation-delay: -.7s; }
@keyframes cheer { 50% { transform: rotate(-20deg); } }
.party-strip { display: none; }
body.has3d .card svg.ic { display: none; }
.badge3d { display: block; margin-top: 4px; font-size: 11px; color: #6b5800; }

/* friends: pill in the top bar, panel (popover on desktop, bottom sheet on a phone) */
.friends-btn { display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 16px 0 12px; border-radius: 30px; border: 0; background: var(--panel); box-shadow: 0 4px 14px rgba(18,48,74,.18); font: inherit; font-weight: 600; color: var(--ink); cursor: pointer; }
.friends-btn .count { display: flex; align-items: center; gap: 5px; font-size: 13px; color: var(--ink-soft); font-weight: 500; }
.sdot { width: 10px; height: 10px; border-radius: 50%; background: #2fa84f; flex: none; box-shadow: 0 0 0 2px #fff; }
.sdot.away { background: #f2c230; } .sdot.offline { background: #9aa7b3; }
.profile .face { position: relative; overflow: visible; } .profile .face svg { border-radius: 50%; }
.profile .face .sdot { position: absolute; right: -1px; bottom: -1px; width: 12px; height: 12px; }
.fpanel { position: fixed; top: 76px; right: 28px; z-index: 8; width: 360px; max-height: calc(100vh - 100px); display: flex; flex-direction: column; background: #fff; border-radius: 22px; box-shadow: 0 18px 50px rgba(18,48,74,.3); overflow: hidden; }
.fpanel[hidden] { display: none; }
.fpanel header { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 8px; }
.fpanel h3 { margin: 0; font-size: 20px; } .fpanel .x { border: 0; background: #eef4fa; width: 32px; height: 32px; border-radius: 50%; font-size: 16px; cursor: pointer; }
.mystatus { display: flex; gap: 6px; padding: 0 16px 10px; }
.mystatus button { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; border: 2px solid #dbe6f0; background: #fff; border-radius: 14px; padding: 6px 4px; font: inherit; font-size: 13px; font-weight: 600; color: var(--ink); cursor: pointer; }
.mystatus button[aria-pressed="true"] { border-color: var(--blue); background: #eaf3ff; }
.mystatus .sdot { box-shadow: none; }
.addf { display: flex; gap: 6px; padding: 0 16px 10px; } .addf input { flex: 1; min-width: 0; border: 2px solid #dbe6f0; border-radius: 14px; padding: 8px 12px; font: inherit; font-size: 14px; } .addf button { border: 0; border-radius: 14px; padding: 0 14px; background: var(--blue); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
.addf-msg { padding: 0 16px 8px; font-size: 12px; color: var(--ink-soft); margin-top: -4px; }
.flist { overflow-y: auto; padding: 0 8px 12px; }
.flist h4 { margin: 10px 8px 4px; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--ink-soft); }
.friend { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 14px; }
.friend:hover { background: #f3f8fc; }
.friend .av { position: relative; width: 38px; height: 38px; flex: none; } .friend .av svg { width: 38px; height: 38px; border-radius: 50%; background: #dff1ff; }
.friend .av .sdot { position: absolute; right: -1px; bottom: -1px; }
.friend .who2 { flex: 1; min-width: 0; line-height: 1.2; } .friend .nm { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .friend .nm .tag { color: var(--ink-soft); font-weight: 500; font-size: 12px; }
.friend .doing { font-size: 12px; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.friend .act { border: 0; border-radius: 12px; padding: 6px 10px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; background: #f1e6ff; color: #4b2a85; white-space: nowrap; }
.friend .act.watch { background: #e6eefc; color: #1f4f9a; } .friend .act.join { background: #d9f5e3; color: #1d6b39; } .friend .act[disabled] { background: #eef1f4; color: #7a8a99; cursor: default; }
.friend.off { opacity: .6; }
.req { display: flex; gap: 6px; } .req button { border: 0; border-radius: 10px; padding: 5px 9px; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer; } .req .ok { background: #2fa84f; color: #fff; } .req .no { background: #eef1f4; color: var(--ink); }
@media (max-width: 760px) {
  .friends-btn { height: 40px; padding: 0 12px 0 10px; } .friends-btn .label, .friends-btn .olabel { display: none; } .friends-btn { gap: 6px; }
  .fpanel { top: auto; bottom: 0; left: 0; right: 0; width: auto; max-height: 80vh; border-radius: 22px 22px 0 0; }
}

footer { position: fixed; bottom: 10px; left: 0; right: 0; z-index: 3; text-align: center; font-size: 13px; }
footer a { color: var(--ink); background: var(--panel); padding: 4px 12px; border-radius: 12px; text-decoration: none; }

/* review notes, mock only */
.note { position: fixed; left: 12px; bottom: 12px; right: auto; top: auto; z-index: 9; background: #fffbe6; border: 2px dashed #e0b400; border-radius: 12px; padding: 8px 12px; font-size: 12px; max-width: 290px; }
.note b { display: inline; } .note summary { cursor: pointer; } .note:not([open]) { padding: 4px 10px; }

/* ---- phone ---- */
@media (max-width: 760px) {
  body { overflow: auto; }
  .top { grid-template-columns: auto 1fr auto; column-gap: 8px; } .logo { justify-self: center; }
  .top { position: sticky; padding: 10px 14px; background: linear-gradient(rgba(191,228,255,.95), rgba(191,228,255,0)); }
  .word { font-size: 30px; -webkit-text-stroke: 5px var(--ink); } .rings { --rw: 14px; } .rings span { border-width: 2.5px; }
  .profile .who { display: none; } .profile { padding: 4px; } .icon-btn { width: 40px; height: 40px; }
  main { display: flex; flex-direction: column; height: auto; padding: 8px 16px 70px; gap: 16px; }
  .sports { order: 1; grid-template-columns: repeat(3, 1fr); gap: 10px; max-height: none; }
  .card { min-height: 84px; padding: 10px; border-radius: 16px; }
  .card .name { font-size: 14px; position: relative; z-index: 1; } .card svg.ic { opacity: .55; } .card .blurb { display: none; } .card svg.ic { width: 54px; height: 54px; right: -6px; top: -6px; }
  .stage { order: 2; padding: 12px; border-radius: 22px; }

  .btn .ico { width: 36px; height: 36px; font-size: 19px; } .btn small { font-size: 11px; } .btn.primary .ico { width: 44px; height: 44px; }
  .party-strip { display: flex; order: 3; gap: 12px; overflow-x: auto; padding: 8px 4px; background: var(--panel); border-radius: 18px; min-width: 0; max-width: 100%; }

  .party-strip svg { width: 44px; height: 44px; }

<body>

<!-- full-screen scene (one inline SVG, ~60 shapes) -->
<div class="scene" aria-hidden="true">
  <svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fd0ff"/><stop offset="1" stop-color="#e6f6ff"/></linearGradient>
    </defs>
