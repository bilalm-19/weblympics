name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# No deploy from this repo (user, 2026-11-13: moved off the course's Fly app),
# so only the checks run; a newer run on the same ref replaces an older one.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so the secret scan can see all commits
      - uses: jdx/mise-action@v4
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Build and start the app
        # the Dockerfile's image, with a throwaway /data; the spec runs
        # against it
        run: |
          docker build -t app .
          docker run -d --init --name app -p 8080:8080 -e PORT=8080 --tmpfs /data app
      - name: Run the spec
        run: pnpm check
        env:
          APP_URL: http://localhost:8080
      - name: Show the app's output
        # what the container printed, so a crash or slow boot is visible
        if: ${{ failure() }}
        run: docker logs app
      - name: Check the process evidence
        # skipped in the template repo itself, where PROCESS.md is still the
        # boilerplate every student replaces
        if: ${{ !github.event.repository.is_template }}
        run: pnpm check:evidence
      - name: Scan for committed secrets
        # Pinned in both halves (action SHA and scanner image) because this
        # runs in every repo in the course. Bump between semesters.
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          version: "3.96.0"
          extra_args: --only-verified
      - name: Scan for a committed course key
        # A course key has no verifier a runner can reach, so this pass
        # matches its shape instead (.github/trufflehog.yml).
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          version: "3.96.0"
          extra_args: >-
            --config=.github/trufflehog.yml
            --include-detectors=CustomRegex --results=unverified
            --no-verification
